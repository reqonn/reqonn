<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="reqon — Owner of Utilities">
  <defs>
    <radialGradient id="glow" cx="82%" cy="18%" r="65%">
      <stop offset="0" stop-color="#a6e4f5" stop-opacity=".20"/>
      <stop offset=".55" stop-color="#a6e4f5" stop-opacity=".04"/>
      <stop offset="1" stop-color="#a6e4f5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset=".45" stop-color="#0a0a0a" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="16" fill="#0a0a0a"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="16" fill="url(#fade)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="279" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <g font-family="'Segoe UI', 'DM Sans', Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#a6e4f5" font-size="15" font-weight="600" letter-spacing="3">HI, I'M</text>
    <text x="62" y="160" fill="#ffffff" font-size="68" font-weight="700" letter-spacing="-1.5">reqon</text>
    <text x="64" y="204" fill="#ffffff" fill-opacity=".62" font-size="21">Owner of Utilities — a Discord bot, its website and the tools around it.</text>
  </g>

  <g font-family="'JetBrains Mono', Consolas, ui-monospace, monospace" font-size="14">
    <rect x="64" y="226" width="148" height="28" rx="14" fill="#a6e4f5" fill-opacity=".10" stroke="#a6e4f5" stroke-opacity=".35"/>
    <circle cx="82" cy="240" r="4" fill="#a6e4f5"/>
    <text x="94" y="245" fill="#d9f4fb">utilities.best</text>
  </g>
</svg>
